name: Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-qi-cultivation/**"
      - ".github/workflows/android-debug-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-qi-cultivation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14.3

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qi-cultivation-debug-apk
          path: android-qi-cultivation/app/build/outputs/apk/debug/app-debug.apk
